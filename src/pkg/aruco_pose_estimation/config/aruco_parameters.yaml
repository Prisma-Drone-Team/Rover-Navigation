/aruco_node:
    ros__parameters:
        # Aruco detection parameters
        marker_size: 0.1 # Size of the markers in meters
        aruco_dictionary_id: DICT_ARUCO_ORIGINAL #DICT_4X4_50 # Aruco dictionary type
        # Input topics
        image_topic: /rover/camera/color/image_raw # Input image topic
        use_depth_input: false # Use depth image for 3D pose estimation
        depth_image_topic: /rover/camera/aligned_depth_to_color/image_raw # Input depth image topic
        camera_info_topic: /rover/camera/color/camera_info # Input camera info topic with camera intrinsic parameters
        camera_frame: rover/camera_rgb_optical_frame # Camera link frame of reference
        # Output topics
        detected_markers_topic: /rover_aruco/markers # Output topic with detected markers (aruco poses + ids)
        markers_visualization_topic: /rover_aruco/poses # Output topic with visualization of detected markers as pose array
        output_image_topic: /rover_aruco/image # Output topic with visualization of detected markers drawn on image
        output_string_topic: /rover_aruco/string # Output topic with visualization of detected markers drawn on image
controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /robot1/odom
    #cmd_vel_topic: /robot1/cmd_vel
    controller_frequency: 5.0 # was 20/50.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 #0.5
    controller_patience: 5.0 
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0 #10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0 #0.25
      yaw_goal_tolerance: 0.5 #0.25
    FollowPath:
          plugin: "teb_local_planner::TebLocalPlannerROS"
          #plugin: "dwb_core::DWBLocalPlanner"
          #plugin: "nav2_mppi_controller::MPPIController"
          map_frame: robot1/map #robot1/map
          # odom_frame: robot1/odom
          # critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
          # BaseObstacle.scale: 0.02
          # PathAlign.scale: 32.0
          # GoalAlign.scale: 24.0
          # PathAlign.forward_point_distance: 0.1
          # GoalAlign.forward_point_distance: 0.1
          # PathDist.scale: 32.0
          # GoalDist.scale: 24.0
          # RotateToGoal.scale: 32.0
          # RotateToGoal.slowing_factor: 5.0
          # RotateToGoal.lookahead_time: -1.0
          # Trajectory
          teb_autosize: 1.0  # deve rimanere un double
          dt_ref: 0.2  # was 0.05
          # model_dt: 0.05
          # controller_period: 0.05
          dt_hysteresis: 0.1  # was 0.1
          global_plan_overwrite_orientation: True
          max_global_plan_lookahead_dist: 2.0  # was 2.0
          feasibility_check_no_poses: 2 #3 #era 5
          publish_feedback: false

          # Robot
          max_vel_x: 0.3  # 0.1
          max_vel_x_backwards: 0.2
          max_vel_theta: 4.0  # 15deg more or less
          acc_lim_x: 1.0  # was 1.0
          acc_lim_theta: 1.0  # was 0.3
          min_turning_radius: 0.0 #molto importante, determina se durante la rotazione le ruote possono andare in versi opposti
          footprint_model:
            type: "circular"
            radius: 0.3
          # GoalTolerance
          xy_goal_tolerance: 0.15  # was 0.1
          yaw_goal_tolerance: 0.15  # was 0.1
          free_goal_vel: False
          allow_init_with_backwards_motion: False
          # backwards_motion_penalty: 10.0

          # Obstacles
          min_obstacle_dist: 0.25 #0.35  # was 0.15
          include_costmap_obstacles: True
          costmap_obstacles_behind_robot_dist: 1.0  # Era 1.0
          obstacle_poses_affected: 10  #  Era 20
          costmap_converter_plugin: ""
          costmap_converter_spin_thread: True
          costmap_converter_rate: 2.0
          inflation_dist: 0.55 #0.5
          include_dynamic_obstacles: True

          # Optimization
          no_inner_iterations: 3  # Era 5
          no_outer_iterations: 2  # Era 4
          optimization_activate: True
          optimization_verbose: False
          penalty_epsilon: 0.04  # was 0.1, must be less than the lower of the max vel x
          weight_max_vel_x: 2.0
          weight_max_vel_theta: 1.0
          weight_acc_lim_x: 1.0
          weight_acc_lim_theta: 1.0
          weight_kinematics_nh: 1000.0
          weight_kinematics_forward_drive: 200.0  # Era 200 e prima ancora 1
          weight_kinematics_turning_radius: 1.0
          weight_optimaltime: 1.0
          weight_obstacle: 100.0  # Era 100,
          weight_dynamic_obstacle: 10.0  # not in use yet
          selection_alternative_time_cost: False  # not in use yet

          # Homotopy Class Planner
          enable_homotopy_class_planning: False  #  True, requires high computational effort
          enable_multithreading: False
          simple_exploration: False
          max_number_classes: 4  # reduce this value to reduce the computational effort
          roadmap_graph_no_samples: 15
          roadmap_graph_area_width: 5.0
          h_signature_prescaler: 0.5
          h_signature_threshold: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: robot1/odom #odom
      robot_base_frame: robot1/base_footprint
      use_sim_time: False
      rolling_window: true
      # width: 10 #was 6
      # height: 10 #was 6
      # origin_x: -50.0
      # origin_y: -50.0
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["gradient_layer", "inflation_layer"] #"voxel_layer""static_layer"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0 #10.0 #was 3.0
        inflation_radius: 0.55 #0.4 #was 0.55
      #gradient_layer:
        #plugin: "costmap_plugin/GradientLayer"
        #enabled: true
        #slope_threshold_deg: 35.0
        #cost_scaling_factor: 4.0
        #inflation_radius: 0.5 #must be equal to the inlfation layer one  
        #octomap_topic: "/robot1/octomap_full"
      gradient_layer:
        plugin: "costmap_plugin::GradientLayer"
        enabled: true
        octomap_topic: "/robot1/octomap_full"
        cloud_topic: "/robot1/cloud_map"
        search_radius: 25.0
        cost_map_plugins: ["slope", "roughness", "shadow"]
        slope:
          plugin: "costmap_plugin::SlopeCostMap"
          weight: 1.0
          slope_threshold_deg: 50.0 #35.0
          cost_scaling_factor: 2.0 #4.0
          search_radius: 25.0
        roughness:
          plugin: "costmap_plugin::RoughnessCostMap"
          weight: 0.5
          roughness_threshold: 0.2 #0.1
          cost_scaling_factor: 200.0 #800.0
          kernel_size: 3
        shadow:
          plugin: "costmap_plugin::ShadowCostMap"
          weight: 0.4
          sun_direction_x: -0.5
          sun_direction_y: 0.5
          sun_direction_z: -1.0
          shadow_cost: 80 #200
          max_ray_cells: 50
          min_sun_angle_deg: 5.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        min_obstacle_height: 0.02
        mark_threshold: 0
        observation_sources: cloud #scan
        cloud:
          topic: /robot1/camera/depth/color/points #(/robot1/scan/points) /robot1/depth/image_raw/points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_range: 3.0 
          observation_persistence: 0.5
          data_type: "PointCloud2" #"LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
      qos_overrides:
        cloud:
          reliability: SENSOR_DATA
          durability: volatile      

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5 #2.0
      publish_frequency: 0.5 #1.0
      global_frame: robot1/map #robot1/map
      robot_base_frame: robot1/base_footprint
      #map_topic: /robot1/map
      use_sim_time: False
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      #-- WARNING THIS IS GOOD ONLY FOR LEAONARDO
      # height: 500 #was 50
      # width: 500 #was 50
      # origin_x: -50.0
      # origin_y: -50.0
      #--
      rolling_window: false
      #width: 20
      #height: 20
      width: 300
      height: 300
      origin_x: -150.0
      origin_y: -150.0
      resolution: 0.1

      plugins: ["gradient_layer", "inflation_layer"] #"obstacle_layer", "static_layer", 
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: cloud #scan
        cloud:
          topic: /robot1/camera/depth/color/points #/robot1/depth/image_raw/points #/scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.02
          clearing: True
          marking: True
          raytrace_range: 3.0 
          observation_persistence: 0.5
          data_type: "PointCloud2" #"LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        subscribe_to_updates: True
        map_subscribe_transient_local: True
      #gradient_layer:
        #plugin: "costmap_plugin/GradientLayer"
        #enabled: true
        #slope_threshold_deg: 45.0
        #cost_scaling_factor: 2.0
        #inflation_radius: 0.5 #must be equal to the inlfation layer one
        #octomap_topic: "/robot1/octomap_full"
      gradient_layer:
        plugin: "costmap_plugin::GradientLayer"
        enabled: true
        octomap_topic: "/robot1/octomap_full"
        cloud_topic: "/robot1/cloud_map"
        search_radius: 10.0 #25.0
        cost_map_plugins: ["slope", "roughness", "shadow"]
        slope:
          plugin: "costmap_plugin::SlopeCostMap"
          weight: 1.0
          slope_threshold_deg: 45.0
          cost_scaling_factor: 2.0
          search_radius: 25.0
        roughness:
          plugin: "costmap_plugin::RoughnessCostMap"
          weight: 0.5
          roughness_threshold: 0.1
          cost_scaling_factor: 800.0
          kernel_size: 3
        shadow:
          plugin: "costmap_plugin::ShadowCostMap"
          weight: 0.4
          sun_direction_x: -0.5
          sun_direction_y: 0.5
          sun_direction_z: -1.0
          shadow_cost: 200
          max_ray_cells: 50
          min_sun_angle_deg: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0 #was 3.0
        inflation_radius: 0.4 #was 0.55
      always_send_full_costmap: True
      qos_overrides:
        cloud:
          reliability: SENSOR_DATA
          durability: volatile            

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.3 #1.0 #10.0  # Era 20
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true #false
      allow_unknown: True

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      cmd_vel_out_topic: /robot1/cmd_vel
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    cmd_vel_topic: /robot1/cmd_vel
    costmap_topic: /robot1/local_costmap/costmap_raw
    footprint_topic: /robot1/local_costmap/published_footprint
    cycle_frequency: 2.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      # backup_dist: 0.2  
      # backup_speed: 0.05
      # time_allowance: 10.0
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: robot1/odom #rover/odom
    global_frame: robot1/map
    robot_base_frame: robot1/base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 4.0
    min_rotational_vel: 0.0
    rotational_acc_lim: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 4.0]
    min_velocity: [-0.3, 0.0, -4.0]
    max_accel: [0.1, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.0]
    odom_topic: "robot1/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0